services:
  mongo:
    image: mongo:7
    container_name: agentautomation-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--username", "${MONGO_ROOT_USER:-root}", "--password", "${MONGO_ROOT_PASSWORD:-changeme}", "--authenticationDatabase", "admin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongo-init-replica:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    env_file:
      - .env
    entrypoint: >
      bash -c "
      mongosh --host mongo:27017 \
        --username ${MONGO_ROOT_USER:-root} \
        --password ${MONGO_ROOT_PASSWORD:-changeme} \
        --authenticationDatabase admin \
        --eval '
          try {
            rs.initiate({
              _id: \"rs0\",
              members: [{ _id: 0, host: \"mongo:27017\" }]
            });
          } catch (e) {
            print(\"Replica set may already be initiated: \" + e.message);
          }
          db.getSiblingDB(\"ai-agent\").createUser({
            user: '"${MONGO_APP_USER:-appuser}"',
            pwd: '"${MONGO_APP_PASSWORD:-apppass}"',
            roles: [{ role: \"readWrite\", db: \"ai-agent\" }]
          });
        ' || true
      "

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: backend
    container_name: agentautomation-backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: backend
    container_name: agentautomation-worker
    command: ["npm", "run", "worker"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Worker → backend internal broadcasts must use the Docker service
      # hostname `backend`, not localhost (which inside the worker
      # container would refer to the worker itself).
      BACKEND_INTERNAL_URL: http://backend:5000
    depends_on:
      mongo:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[n]ode src/agents/runner.js' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: frontend
    container_name: agentautomation-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # Server-only: read by next.config.js so the Next.js server can
      # proxy /api/* and /socket.io/* to the backend container. Never
      # sent to the browser, so the Docker-internal hostname is safe
      # here.
      BACKEND_INTERNAL_URL: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode<500?0:1)).on('error', () => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

  nginx:
    image: nginx:1.27-alpine
    container_name: agentautomation-nginx
    profiles: ["proxy"]
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mongo_data:

